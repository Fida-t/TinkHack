<!DOCTYPE html>
<html>
    <head>
        <title>TinkHack</title>
        <link rel="icon" type="image/png" href="images/Favicon.png">
        <link rel="stylesheet" href="styleform.css">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    </head>

    <body>

        <header>
            <h2>TINK HACK REGISTRATION</h2>
        </header>

        <form action="file.php" method="post" >
            <label for="group">No. of Group members:</label>
            <select id="group" required>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select><br>



            <label for="name">Team Name: </label>
            <input id="name" type="text"><br>

            <label for="name1">Name of Participant 1: </label>
            <input id="name1" type="text" required><br>

            <label for="name2">Name of Participant 2: </label>
            <input id="name2" type="text"><br>

            <label for="name3">Name of Participant 3: </label>
            <input id="name3" type="text"><br>

            <label for="name4">Name of Participant 4: </label>
            <input id="name4" type="text" ><br>

            <label for="mail">Email Id: </label>
            <input id="mail" type="email" required><br>

            <label for="collage">Name of Institution: </label>
            <input id="collage" type="text" required><br>

            <label for="course">Course Studying: </label>
            <input id="course" type="text" required><br>

            <input type="submit">
            <input type="reset"><br>

        

        </form>
    </body>
</html>
